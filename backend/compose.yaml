services:
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器间走 Compose 内网，MYSQL_PORT 仅用于 MySQL 的宿主机端口。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-market_daily}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-marketdaily}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MARKET_ADMIN_KEY: ${MARKET_ADMIN_KEY:-}
      MARKET_HOURLY_CRON: "${MARKET_HOURLY_CRON:-0 5 * * * *}"
      MARKET_DAILY_CRON: "${MARKET_DAILY_CRON:-0 30 8,18 * * *}"
      GOLD_OHLC_API_KEY: ${GOLD_OHLC_API_KEY:-}
      GOLD_OHLC_CRON: "${GOLD_OHLC_CRON:-0 12 * * * *}"
      GOLD_SGE_DAILY_CRON: "${GOLD_SGE_DAILY_CRON:-0 40 8,18 * * *}"
      NEWS_GDELT_QUERY: ${NEWS_GDELT_QUERY:-}
      NEWS_GDELT_ENABLED: "${NEWS_GDELT_ENABLED:-true}"
      JIN10_MCP_TOKEN: ${JIN10_MCP_TOKEN:-}
      NEWS_SCORE_WEIGHTS: ${NEWS_SCORE_WEIGHTS:-40,30,20,10}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MARKETDAILY_REPORT_SCHEDULE_ENABLED: ${MARKETDAILY_REPORT_SCHEDULE_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # 使用镜像自带的 Bash 检查 HTTP 状态，Flyway 未完成时不会判定后端就绪。
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == HTTP/*" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-market_daily}
      MYSQL_USER: ${MYSQL_USERNAME:-marketdaily}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
